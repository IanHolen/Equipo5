<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>The Zazacrifice of Shaggy</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block" rel="stylesheet">
    <style>
      :root {
        --green: #59e02a;          /* verde del juego */
        --green-glow: rgba(89, 224, 42, 0.4);
        --red: #e01e1e;            /* contorno rojo del juego */
        --red-dark: #7a0d0d;
        --ink: #ece7d8;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; min-height: 100%; width: 100%;
        background: #050307; color: var(--ink);
        font-family: 'Press Start 2P', 'Courier New', monospace;
        overflow-x: hidden;
      }
      /* Fondo tipo mazmorra: verde (Shaggy) + azul (magia) + fuego/lava abajo */
      body {
        background:
          radial-gradient(circle at 50% 8%, rgba(89,224,42,0.10), transparent 40%),
          radial-gradient(circle at 14% 24%, rgba(70,120,255,0.11), transparent 42%),
          radial-gradient(ellipse at 50% 112%, rgba(255,95,20,0.30), rgba(190,25,10,0.12) 32%, transparent 62%),
          radial-gradient(ellipse at 50% 34%, #1b1030 0%, #0a0714 55%, #050307 100%);
        background-attachment: fixed;
      }
      /* Brillo de fuego que titila (vivo) */
      .fire {
        position: fixed; left: 0; right: 0; bottom: -20%; height: 55%; z-index: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 100%, rgba(255,110,25,0.35), rgba(220,40,10,0.10) 40%, transparent 70%);
        animation: flicker 3.2s ease-in-out infinite; will-change: opacity, transform;
      }
      @keyframes flicker {
        0%,100% { opacity: .85; transform: scaleY(1); }
        25%     { opacity: 1;   transform: scaleY(1.05); }
        50%     { opacity: .7;  transform: scaleY(.97); }
        75%     { opacity: .95; transform: scaleY(1.03); }
      }
      /* Brasas subiendo */
      .embers {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background-image:
          radial-gradient(2px 2px at 12% 90%, rgba(255,160,60,.9), transparent),
          radial-gradient(1.5px 1.5px at 32% 96%, rgba(255,90,30,.85), transparent),
          radial-gradient(2px 2px at 55% 92%, rgba(255,190,90,.9), transparent),
          radial-gradient(1px 1px at 72% 98%, rgba(255,120,40,.85), transparent),
          radial-gradient(2px 2px at 88% 94%, rgba(255,150,55,.9), transparent),
          radial-gradient(1.5px 1.5px at 44% 88%, rgba(255,170,70,.8), transparent);
        background-repeat: no-repeat;
        animation: rise 8.5s linear infinite; will-change: transform, opacity;
      }
      .embers.slow { animation-duration: 13s; opacity: .6; }
      @keyframes rise {
        0%   { transform: translateY(10vh) scale(1); opacity: 0; }
        15%  { opacity: .9; }
        85%  { opacity: .9; }
        100% { transform: translateY(-100vh) scale(1.1); opacity: 0; }
      }
      /* Scanlines retro */
      body::before {
        content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
        background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0px, rgba(0,0,0,0.16) 1px, transparent 2px, transparent 3px);
        opacity: 0.3; mix-blend-mode: multiply;
      }
      .page {
        position: relative; z-index: 1;
        min-height: 100vh; min-height: 100dvh;
        display: flex; flex-direction: column; align-items: center;
        padding: clamp(16px, 4vw, 42px) 12px 28px;
        gap: clamp(14px, 3vw, 30px);
      }
      /* --- Título estilo juego: verde con contorno rojo grueso --- */
      .title { text-align: center; line-height: 1.55; }
      .title h1 {
        margin: 0;
        font-size: clamp(16px, 5vw, 44px);
        color: var(--green);
        letter-spacing: 1px;
        text-shadow:
          /* contorno rojo (8 direcciones, 2 grosores) */
          -2px -2px 0 var(--red), 2px -2px 0 var(--red), -2px 2px 0 var(--red), 2px 2px 0 var(--red),
          -2px 0 0 var(--red), 2px 0 0 var(--red), 0 -2px 0 var(--red), 0 2px 0 var(--red),
          -3px 0 0 var(--red), 3px 0 0 var(--red), 0 -3px 0 var(--red), 0 3px 0 var(--red),
          -1px 3px 0 var(--red), 1px 3px 0 var(--red),
          /* profundidad + brillo */
          4px 6px 0 rgba(0,0,0,.5),
          0 0 24px var(--green-glow);
      }
      .title .sub {
        display: block; margin-top: 18px;
        font-size: clamp(7px, 1.9vw, 11px);
        color: #c3b0e0; letter-spacing: 1px;
        text-shadow: 2px 2px 0 #000, 0 0 10px rgba(70,120,255,0.25);
      }
      /* --- Pantalla del juego enmarcada --- */
      #unity-container { width: 100%; max-width: 1000px; display: flex; flex-direction: column; align-items: center; }
      .screen-frame {
        position: relative; width: 100%; background: #000;
        border: 4px solid #17131f; border-radius: 14px; padding: 10px;
        box-shadow: 0 0 0 2px #2a2338 inset, 0 0 55px rgba(89,224,42,0.20), 0 24px 60px rgba(0,0,0,0.7);
      }
      #unity-canvas {
        display: block; width: 100%; height: auto; aspect-ratio: 960 / 600;
        background: #050308; border-radius: 6px; image-rendering: pixelated;
      }
      /* --- Barra de carga --- */
      #unity-loading-bar {
        display: none; position: absolute; inset: 0; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: rgba(5,3,10,0.94); border-radius: 10px;
      }
      .loader-text { font-size: clamp(9px, 2.2vw, 12px); color: var(--green); text-shadow: 0 0 10px var(--green-glow); animation: blink 1.1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: .35; } }
      #unity-progress-bar-empty { width: min(70%, 420px); height: 20px; background: #120e1c; border: 2px solid #2c2440; border-radius: 3px; overflow: hidden; box-shadow: inset 0 0 8px #000; }
      #unity-progress-bar-full { width: 0%; height: 100%; background: linear-gradient(90deg, #3aa62f, var(--green)); box-shadow: 0 0 12px var(--green-glow); transition: width .2s; }
      #unity-warning { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 5; }
      #unity-warning > div { color: #000; border-radius: 4px; margin: 4px; }
      /* --- Footer --- */
      #unity-footer { margin-top: 16px; width: 100%; max-width: 1000px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; font-size: clamp(7px, 1.7vw, 10px); color: #9184b0; }
      #unity-fullscreen-button { font-family: inherit; font-size: inherit; cursor: pointer; color: var(--green); background: #120e1c; border: 2px solid #2c2440; border-radius: 6px; padding: 10px 14px; text-shadow: 0 0 8px var(--green-glow); transition: all .15s; }
      #unity-fullscreen-button:hover { border-color: var(--green); box-shadow: 0 0 14px var(--green-glow); transform: translateY(-1px); }
      #unity-footer .credit { text-shadow: 2px 2px 0 #000; text-align: right; line-height: 1.9; }
      #unity-footer .credit b { color: var(--red); }
      @media (max-width: 560px) { .screen-frame { padding: 6px; border-width: 3px; } }
      @media (prefers-reduced-motion: reduce) { .fire, .embers, .loader-text, #unity-loading-bar .loader-text { animation: none !important; } }
    </style>
  </head>
  <body>
    <div class="fire"></div>
    <div class="embers"></div>
    <div class="embers slow"></div>
    <div class="page">
      <header class="title">
        <h1>The Zazacrifice<br>of Shaggy</h1>
        <span class="sub">◆ Un RPG de fantasía, batallas y magia ◆</span>
      </header>

      <div id="unity-container">
        <div class="screen-frame">
          <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
          <div id="unity-loading-bar">
            <div class="loader-text">CARGANDO EL MUNDO...</div>
            <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
          </div>
          <div id="unity-warning"> </div>
        </div>
        <div id="unity-footer">
          <button id="unity-fullscreen-button" type="button">⛶ Pantalla completa</button>
          <span class="credit">Proyecto académico · <b>Tecnológico de Monterrey</b><br class="credit-br">Desarrollado por el <b>Equipo 5</b></span>
        </div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() { warningBanner.style.display = warningBanner.children.length ? 'block' : 'none'; }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() { warningBanner.removeChild(div); updateBannerVisibility(); }, 5000);
        }
        updateBannerVisibility();
      }
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Equipo5-webgl.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Equipo5-webgl.data",
        frameworkUrl: buildUrl + "/Equipo5-webgl.framework.js",
        codeUrl: buildUrl + "/Equipo5-webgl.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "ZAZA INC",
        productName: "zazacrife",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }
      document.querySelector("#unity-loading-bar").style.display = "flex";
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => { unityInstance.SetFullscreen(1); };
        }).catch((message) => { alert(message); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
