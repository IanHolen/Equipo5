name: Unity - Solicitar activación (.alf)

# Ejecuta ESTE workflow UNA sola vez para obtener el archivo de licencia .alf.
# Pasos:
#   1) Actions -> "Unity - Solicitar activación (.alf)" -> Run workflow
#   2) Al terminar, descarga el artefacto "Unity_v2021.x.alf"
#   3) Súbelo a https://license.unity3d.com/manual (inicia sesión con tu cuenta Unity nueva)
#   4) Te descarga un archivo .ulf -> pega TODO su contenido en el secret UNITY_LICENSE
#   5) Ya puedes borrar/ignorar este workflow; corre el de "Build & Deploy WebGL".
# Guía oficial: https://game.ci/docs/github/activation

on:
  workflow_dispatch:

jobs:
  activation:
    name: Solicitar archivo de activación
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2021.3.19f1

      - name: Subir el archivo .alf como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.getManualLicenseFile.outputs.filePath }}
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
