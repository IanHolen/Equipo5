name: Unity - Generar .alf (sin instalar nada)

# Genera el archivo de activación manual (.alf) usando la imagen Docker oficial de Unity,
# sin necesidad de instalar Unity en tu computadora. Corre UNA vez.
# Pasos:
#   1) Actions -> "Unity - Generar .alf (sin instalar nada)" -> Run workflow
#   2) Al terminar, descarga el artefacto "unity-alf" (contiene un archivo .alf)
#   3) Súbelo a https://license.unity3d.com/manual (inicia sesión con tu cuenta Unity)
#   4) Elige Unity Personal -> te descarga un .ulf
#   5) Pega TODO el contenido del .ulf en el secret UNITY_LICENSE
#      y crea UNITY_EMAIL / UNITY_PASSWORD con tu cuenta Unity.

on:
  workflow_dispatch:

jobs:
  alf:
    name: Crear archivo de activación
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-2021.3.19f1-webgl-3.2.2
    steps:
      - name: Crear .alf con Unity en modo batch
        run: |
          # Unity devuelve exit code != 0 aunque genere el archivo; por eso el "|| true".
          unity-editor -batchmode -nographics -logFile /dev/stdout \
            -createManualActivationFile -quit || true
          echo "=== Buscando el .alf generado ==="
          mkdir -p out
          found="$(find / -name '*.alf' 2>/dev/null | head -1)"
          if [ -z "$found" ]; then
            echo "::error::No se generó ningún .alf."
            exit 1
          fi
          echo "Encontrado: $found"
          cp "$found" out/
          ls -la out

      - name: Subir el .alf como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: unity-alf
          path: out/*.alf
