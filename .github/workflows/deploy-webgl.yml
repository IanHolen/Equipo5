name: Build & Deploy WebGL

# Compila el juego Unity a WebGL corriendo Unity DIRECTO en la imagen Docker oficial
# (sin la action game-ci, que rompe con el formato de licencia nuevo de Unity).
# Activa con email+password (licencia Personal), sin serial.
# Requisitos:
#   Secrets del repo: UNITY_EMAIL, UNITY_PASSWORD
#   Variable del repo (opcional): BACKEND_URL (URL pública del backend). Sin ella, el juego
#     compila igual pero login/guardado no funcionarán hasta configurarla.

on:
  push:
    branches: [main]
    paths:
      - 'videogames/**'
      - '.github/workflows/deploy-webgl.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  UNITY_IMAGE: unityci/editor:ubuntu-2021.3.19f1-webgl-3.2.2
  PROJECT_PATH: videogames/zazacrife

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Inyectar URL del backend
        run: |
          if [ -z "${{ vars.BACKEND_URL }}" ]; then
            echo "::warning::BACKEND_URL no está configurada. El juego compilará, pero login/guardado no funcionarán hasta ponerla en Settings > Variables."
          else
            echo "Inyectando backend: ${{ vars.BACKEND_URL }}"
            find "$PROJECT_PATH/Assets/Scripts" -name '*.cs' -print0 \
              | xargs -0 sed -i "s#https://BACKEND-URL-PLACEHOLDER#${{ vars.BACKEND_URL }}#g"
          fi

      - name: Cache de Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-webgl-${{ hashFiles('videogames/zazacrife/Assets/**', 'videogames/zazacrife/Packages/**', 'videogames/zazacrife/ProjectSettings/**') }}
          restore-keys: |
            Library-webgl-
            Library-

      - name: Compilar WebGL en Unity (Docker, licencia entitlement + credenciales)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          docker run --rm \
            --env UNITY_EMAIL \
            --env UNITY_PASSWORD \
            --env UNITY_LICENSE \
            --env WEBGL_OUTPUT=/project/build/WebGL \
            --volume "$PWD:/project" \
            --workdir /project \
            "$UNITY_IMAGE" \
            bash -c '
              set -e
              echo "== Colocando el archivo de licencia entitlement (activa el asiento) =="
              for d in "/root/.local/share/unity3d/Unity/licenses" "/usr/share/unity3d/licenses"; do
                mkdir -p "$d" 2>/dev/null || true
                printf "%s" "$UNITY_LICENSE" > "$d/UnityEntitlementLicense.xml" 2>/dev/null || true
              done
              echo "== Activando (Personal, con archivo + credenciales, sin serial) y compilando =="
              unity-editor \
                -batchmode -nographics -quit \
                -logFile /dev/stdout \
                -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" \
                -projectPath /project/'"$PROJECT_PATH"' \
                -buildTarget WebGL \
                -executeMethod Builder.PerformWebGLBuild
            '

      - name: Localizar salida WebGL y arreglar permisos
        run: |
          sudo chown -R "$(id -u):$(id -g)" build || true
          echo "Estructura del build:"
          find build -maxdepth 3 -type d 2>/dev/null || true
          dir="$(dirname "$(find build -name index.html | head -1)")"
          if [ -z "$dir" ] || [ ! -f "$dir/index.html" ]; then
            echo "::error::No se encontró index.html en el build."
            exit 1
          fi
          echo "WEBGL_DIR=$dir" >> "$GITHUB_ENV"
          echo "index.html en: $dir"

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.WEBGL_DIR }}

  deploy:
    name: Deploy a GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
