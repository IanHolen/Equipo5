name: Deploy WebGL (static)

# El juego se compila LOCALMENTE con Unity (Unity 2021.3 no corre en macOS 26; se usa Unity 6.5).
# Este workflow solo PUBLICA la carpeta ya compilada `webgl/` en GitHub Pages. No usa Unity.
# Para actualizar el juego: recompilar local -> reemplazar `webgl/` -> push.

on:
  push:
    branches: [main]
    paths:
      - 'webgl/**'
      - '.github/workflows/deploy-webgl.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy a GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Subir carpeta webgl como artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: webgl

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
